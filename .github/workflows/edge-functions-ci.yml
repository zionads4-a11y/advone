name: Edge Functions CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-ci.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/edge-functions-ci.yml'

jobs:
  validate:
    name: Type-check, lint and test edge functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint all edge functions
        run: deno lint supabase/functions

      - name: Type-check every edge function entry point
        run: |
          set -e
          shopt -s nullglob
          failed=0
          for fn in supabase/functions/*/index.ts; do
            echo "::group::deno check $fn"
            if ! deno check "$fn"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "❌ One or more edge functions failed type-check"
            exit 1
          fi

      - name: Run unit tests for edge functions
        run: deno test --allow-net --allow-env --allow-read supabase/functions

  frontend-typecheck:
    name: Frontend TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: tsc --noEmit
        run: bunx tsc --noEmit
